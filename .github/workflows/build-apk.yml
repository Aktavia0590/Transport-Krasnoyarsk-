name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -o *.zip -d project
          cd project
          if [ -d "Мой_билет_Android_simple" ]; then
            shopt -s dotglob
            mv "Мой_билет_Android_simple"/* .
            rmdir "Мой_билет_Android_simple"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: project
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Add Android
        working-directory: project
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moy-bilet-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
