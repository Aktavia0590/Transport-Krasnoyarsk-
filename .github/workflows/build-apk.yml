name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          cd project

          if [ -d "Мой_билет_Android_simple" ]; then
            shopt -s dotglob
            mv "Мой_билет_Android_simple"/* .
            rmdir "Мой_билет_Android_simple"
          fi

          echo "Project root:"
          ls -la


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Install dependencies
        working-directory: project
        shell: bash
        run: |
          set -e

          npm install

          npm install @capacitor/core @capacitor/cli @capacitor/android


      - name: Build web app
        working-directory: project
        shell: bash
        run: |
          set -e

          npm run build


      - name: Add Android
        working-directory: project
        shell: bash
        run: |
          set -e

          npx cap add android
          npx cap sync android


      - name: Add camera permission
        working-directory: project
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"
          fi

          echo "Camera permission configured"


      - name: Fix Kotlin dependencies
        working-directory: project
        shell: bash
        run: |
          set -e

          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }

          EOF


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      - name: Build APK
        working-directory: project/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moy-bilet-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
