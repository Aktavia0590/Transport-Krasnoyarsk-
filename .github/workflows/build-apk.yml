name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================
      # 1. Скачать репозиторий
      # =========================
      - name: Checkout
        uses: actions/checkout@v5


      # =========================
      # 2. Распаковать ZIP проекта
      # =========================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d project

          cd project

          if [ -d "Мой_билет_Android_simple" ]; then
            shopt -s dotglob
            mv "Мой_билет_Android_simple"/* .
            rmdir "Мой_билет_Android_simple"
          fi

          echo ""
          echo "===== PROJECT ROOT ====="
          ls -la

          echo ""
          echo "===== SOURCE ====="
          ls -la src


      # =========================
      # 3. Исправить React Router
      # =========================
